[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evasbroese-mlopsarch_jd293"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别MLOps 平台架构师·越狱模板的变体识别上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "evasbroese" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://evasbroese.github.io"
Repository = "https://github.com/evasbroese/mlopsarch_jd293"
Issues = "https://github.com/evasbroese/mlopsarch_jd293/issues"

[project.scripts]
mlopsarch_jd293 = "mlopsarch_jd293:main"

[tool.setuptools]
py-modules = ["mlopsarch_jd293"]
